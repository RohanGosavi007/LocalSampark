apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * Sentry JS source-map upload.
 *
 * Without this, crash reports arrive with minified Hermes frames like
 * "index.android.bundle:1:3125598" instead of a file and line.
 *
 * @sentry/react-native's config plugin would normally wire this during
 * `expo prebuild`, but this project builds from the committed android/ folder,
 * so the plugin never runs against it — the apply has to be explicit.
 *
 * It is deliberately conditional. sentry.gradle shells out to sentry-cli, which
 * needs SENTRY_AUTH_TOKEN plus SENTRY_ORG/SENTRY_PROJECT; with no credentials
 * the upload task fails and takes the whole release build down with it. Gating
 * on the token means a build without Sentry configured is completely unaffected,
 * and uploads start happening the moment the credentials exist — no code change
 * needed. Set them in the environment, or in android/sentry.properties.
 */
def sentryAuthToken = System.getenv('SENTRY_AUTH_TOKEN') ?: project.findProperty('sentryAuthToken')
def sentryPropertiesFile = rootProject.file('sentry.properties')

if (sentryAuthToken || sentryPropertiesFile.exists()) {
    def sentryPackageJson = ["node", "--print", "require.resolve('@sentry/react-native/package.json')"]
        .execute(null, rootDir).text.trim()
    def sentryGradle = new File(new File(sentryPackageJson).getParentFile(), "sentry.gradle")
    if (sentryGradle.exists()) {
        println "Sentry: credentials detected, enabling source-map upload."
        apply from: sentryGradle
    } else {
        println "Sentry: sentry.gradle not found at ${sentryGradle}, skipping source-map upload."
    }
} else {
    println "Sentry: no SENTRY_AUTH_TOKEN and no android/sentry.properties - source-map upload disabled (build unaffected)."
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release identity. Resolved here rather than inside defaultConfig, where the
 * Android DSL delegate shadows findProperty and yields null.
 */
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: '1.0.0').toString()

/**
 * Upload-keystore credentials.
 *
 * These four values used to live in android/gradle.properties, which is a
 * tracked file — the release signing password was committed to the repository.
 * They now come from android/keystore.properties, which is gitignored.
 *
 * Resolution order, most specific first:
 *   1. a Gradle project property (-PMYAPP_UPLOAD_... or ORG_GRADLE_PROJECT_*),
 *      so CI can inject them from its secret store with no file on disk;
 *   2. android/keystore.properties, for local release builds;
 *   3. nothing — the release signingConfig below then fails loudly rather than
 *      silently falling back to the debug keystore.
 */
def signingProps = [:]
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    def loaded = new Properties()
    keystorePropsFile.withInputStream { loaded.load(it) }
    loaded.stringPropertyNames().each { signingProps[it] = loaded.getProperty(it) }
}
['MYAPP_UPLOAD_STORE_FILE', 'MYAPP_UPLOAD_STORE_PASSWORD',
 'MYAPP_UPLOAD_KEY_ALIAS', 'MYAPP_UPLOAD_KEY_PASSWORD'].each { name ->
    def override = project.findProperty(name)
    if (override != null) signingProps[name] = override.toString()
}

/**
 * Short staging path for CMake/ninja native intermediates, used only where the
 * project path would otherwise be too long or contain spaces (Windows).
 * Override with -PcxxStagingDirectory=<path>, or set it to "default" to force
 * the standard in-project app/.cxx location.
 */
def cxxStagingDirectory = {
    def override = project.findProperty('cxxStagingDirectory')
    if (override != null) {
        return override.toString().equalsIgnoreCase('default') ? null : override.toString()
    }
    if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
        return null
    }
    // Derived from the drive the project actually sits on rather than hardcoded
    // to "C:/tmp/cxx_app". A checkout on another drive, or a machine whose C: is not
    // writable got an unwritable staging path and a CMake configure failure that
    // named a directory nobody had chosen. Uses the root of rootDir's own drive,
    // which is writable by definition because the checkout lives there.
    def drive = rootDir.toPath().getRoot()
    def drivePrefix = (drive == null) ? 'C:/' : drive.toString().replace(File.separator, '/')
    return drivePrefix + 'tmp/cxx_app'
}()

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'in.localsampark.app'
    defaultConfig {
        applicationId 'in.localsampark.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects an upload whose versionCode already exists, so this must
        // move on every release. CI passes -PappVersionCode=<build number>.
        versionCode appVersionCode
        versionName appVersionName
        ndk {
            // armeabi-v7a covers 32-bit handsets, which remain a meaningful
            // share of the low-end Android base this app targets. Dropping it
            // makes the app uninstallable on those devices rather than merely
            // slower. Keep this list in sync with reactNativeArchitectures in
            // gradle.properties — that property controls which ABIs the native
            // libraries are actually compiled for, and an ABI listed here but
            // not built there yields an APK with no .so files for it.
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (signingProps.containsKey('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(signingProps['MYAPP_UPLOAD_STORE_FILE'])
                storePassword signingProps['MYAPP_UPLOAD_STORE_PASSWORD']
                keyAlias signingProps['MYAPP_UPLOAD_KEY_ALIAS']
                keyPassword signingProps['MYAPP_UPLOAD_KEY_PASSWORD']
            } else {
                // No upload keystore configured. This block previously fell back
                // to debug.keystore, which produced a debug-signed "release"
                // artifact that Play rejects and that cannot be upgraded by a
                // properly signed build later. Fail loudly instead, but only
                // when a release artifact is actually being requested so that
                // debug builds and IDE syncs still work.
                def wantsRelease = gradle.startParameter.taskNames.any {
                    it.toLowerCase().contains('release')
                }
                if (wantsRelease) {
                    throw new GradleException(
                        "Refusing to sign a release build with the debug keystore.\n" +
                        "Set MYAPP_UPLOAD_STORE_FILE, MYAPP_UPLOAD_STORE_PASSWORD, " +
                        "MYAPP_UPLOAD_KEY_ALIAS and MYAPP_UPLOAD_KEY_PASSWORD in " +
                        "android/keystore.properties (gitignored), in " +
                        "~/.gradle/gradle.properties, or pass them with -P."
                    )
                }
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    externalNativeBuild {
        cmake {
            // CMake/ninja on Windows break on this project's long, space-bearing
            // path ("...\localsampark 14-08-2026\localsampark 12-08-2026\..."),
            // so native intermediates are staged under a short path there. On
            // other platforms the default (app/.cxx) is correct and keeps the
            // intermediates inside the project, where `clean` can reach them.
            if (cxxStagingDirectory != null) {
                buildStagingDirectory file(cxxStagingDirectory)
            }
        }
    }
}

/**
 * `clean` deletes app/build — including the generated codegen JNI sources that
 * build/generated/autolinking/.../Android-autolinking.cmake points at — but it
 * cannot reach buildStagingDirectory when that lives outside the project tree.
 * The stale ninja state left behind then makes externalNativeBuildClean* re-run
 * a CMake configure against directories that no longer exist, and the whole
 * clean fails. Wiping the staging directory first leaves that task nothing to
 * do, so it no-ops instead of erroring.
 */
if (cxxStagingDirectory != null) {
    tasks.register('cleanCxxStagingDirectory', Delete) {
        delete cxxStagingDirectory
    }
    tasks.matching { it.name.startsWith('externalNativeBuildClean') }.configureEach {
        dependsOn 'cleanCxxStagingDirectory'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: 'com.google.gms.google-services'