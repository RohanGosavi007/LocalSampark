name: CI/CD Pipeline (Render)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: localsampark_admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: localsampark
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://localsampark_admin:testpassword@localhost:5432/localsampark
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
        run: |
          cd backend
          npm install
          npx prisma generate
          npx prisma migrate dev --name init
          npm test --if-present

  deploy-to-render:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          # Trigger deployment to Render
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          echo "Deployment triggered on Render!"
