name: CI/CD Pipeline (Render)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: this pipeline only reads the repository. Without an explicit
# block the job inherits whatever the repository default is, which is commonly
# read/write on every scope.
permissions:
  contents: read

# Two pushes to main previously produced two overlapping deploys, each running
# `prisma migrate deploy` and the raw-SQL migration runner against the same
# production database at the same time. cancel-in-progress is deliberately
# false: cancelling a run midway through applying migrations is worse than
# queueing behind it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: localsampark_admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: localsampark
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies
        # backend is an npm workspace of the root, so this installs it too.
        run: npm ci

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://localsampark_admin:testpassword@localhost:5432/localsampark
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
        run: |
          npm exec --workspace=backend -- prisma generate
          # `migrate dev` is the interactive authoring command: it wants to
          # create a new migration and prompts/errors on drift. CI applies the
          # committed migrations instead.
          npm exec --workspace=backend -- prisma migrate deploy
          npm run test --workspace=backend

  deploy-to-render:
    needs: test-and-lint
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Apply Production DB Migrations
        # Render's deploy hook only rebuilds and restarts the app; it does not
        # run migrations. Without this step, schema changes merged to main
        # never reach the production database until someone runs it by hand.
        #
        # Two separate migration systems exist and both must run: Prisma
        # (prisma/schema.prisma, ~12 models) and the raw-SQL runner
        # (src/migrations/*.sql, ~300 tables — everything from `posts` to
        # `local_shops` to `carpool_rides`). Running only `prisma migrate
        # deploy` silently skips the second, larger schema entirely.
        #
        # `cd backend && npm ci` could never work: backend is a workspace and
        # has no lockfile of its own, and `npm ci` refuses to run without one.
        # This step therefore failed on every push to main, which meant the
        # Render deploy hook below never fired either — main has not actually
        # been deploying.
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          npm ci
          npm exec --workspace=backend -- prisma generate
          npm exec --workspace=backend -- prisma migrate deploy
          npm run migrate --workspace=backend

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # A bare `curl -X POST` exits 0 on an HTTP 404/401, so a missing or
          # rotated hook secret produced a green "Deployment triggered!" for a
          # deploy that was never requested. -f makes an error status a failure;
          # the explicit empty check catches an unset secret, which would
          # otherwise make curl fail with a confusing "no URL specified".
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error title=Missing secret::RENDER_DEPLOY_HOOK_URL is not set in the production environment."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deployment triggered on Render."

      - name: Wait for Deployment & Health Check
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://localsampark-api.onrender.com/health
        run: |
          # The old loop polled /health and exited 0 on the first 200 response.
          # Render keeps the PREVIOUS instance serving while the new one builds,
          # so that 200 arrived within seconds — from the old build — and the
          # pipeline reported a healthy deploy before the new code had even
          # compiled. A failed deploy looked identical to a successful one.
          #
          # /health now reports the commit it is running (server.js reads
          # GIT_COMMIT / RENDER_GIT_COMMIT), so wait for THIS commit to answer.
          echo "Waiting for $EXPECTED_SHA to become live at $HEALTH_URL"
          max_retries=40
          wait_time=15
          for i in $(seq 1 $max_retries); do
            body=$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)
            if [ -n "$body" ]; then
              status=$(printf '%s' "$body" | jq -r '.status // "unknown"')
              live=$(printf '%s' "$body" | jq -r '.commit // "unknown"')
              echo "  attempt $i/$max_retries: status=$status commit=$live"
              if [ "$status" = "ok" ] && [ "$live" = "$EXPECTED_SHA" ]; then
                echo "✅ $EXPECTED_SHA is live and healthy."
                exit 0
              fi
              if [ "$live" = "unknown" ]; then
                # GIT_COMMIT is not wired up in the Render dashboard yet. Fall
                # back to the old behaviour rather than blocking the deploy, but
                # make the weaker guarantee visible instead of silent.
                echo "::warning title=Cannot verify deployed commit::/health reports no commit. Set GIT_COMMIT (or enable RENDER_GIT_COMMIT) in the Render dashboard so this check can confirm the new build is live."
                if [ "$status" = "ok" ]; then
                  echo "⚠️  Service is healthy, but this does NOT confirm the new build is serving."
                  exit 0
                fi
              fi
            else
              echo "  attempt $i/$max_retries: no response yet"
            fi
            sleep $wait_time
          done
          echo "::error title=Deploy verification failed::$EXPECTED_SHA did not become live within $((max_retries * wait_time))s."
          exit 1
