name: LocalSampark CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        # The repo root is the npm-workspaces root (backend, apps/web,
        # apps/admin, packages/*) and carries the only lockfile for them.
        cache-dependency-path: package-lock.json

    - name: Install Monorepo Dependencies
      run: npm ci

    - name: Run Linting check
      run: npm run test --if-present

  build-android:
    # Deliberately NOT `needs: build-and-test`. apps/mobile is not part of the
    # root workspaces list, so nothing in that job validates or even installs
    # the mobile app — gating on it only serialises two unrelated builds.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        # apps/mobile is a standalone package with its own lockfile; the root
        # workspace install does not reach it.
        cache-dependency-path: apps/mobile/package-lock.json

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Install Mobile Dependencies
      working-directory: apps/mobile
      # postinstall runs scripts/postinstall.js + patch-package, so
      # --ignore-scripts would silently ship unpatched native modules.
      run: npm ci

    # The release keystore is gitignored (*.keystore), so CI has to
    # materialise it from a secret. app/build.gradle throws a GradleException
    # rather than falling back to debug.keystore, so a release build without
    # these secrets fails fast and loudly instead of producing an artifact
    # that Play will reject and that can never be upgraded in place.
    - name: Decode Upload Keystore
      id: keystore
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_B64" ]; then
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the base64-encoded upload keystore \
        plus ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD as repository secrets."
          exit 1
        fi
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
        echo "path=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_OUTPUT"

    # No manual `npx react-native bundle` step.
    #
    # Two reasons it was wrong here:
    #   1. RN 0.81 no longer bundles @react-native-community/cli, and this
    #      project does not depend on it, so `npx react-native bundle` cannot
    #      resolve. Expo projects bundle with `expo export:embed`.
    #   2. It is redundant regardless: android/app/build.gradle already sets
    #      `bundleCommand = "export:embed"` inside the react {} block, so
    #      assembleRelease produces index.android.bundle itself, using the
    #      project's metro.config.js. Pre-bundling by hand just races the
    #      Gradle task for the same output path.
    - name: Build Android Release APK
      working-directory: apps/mobile/android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace \
          -PMYAPP_UPLOAD_STORE_FILE="${{ steps.keystore.outputs.path }}" \
          -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
          -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
          -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
          -PappVersionCode=${{ github.run_number }} \
          -PappVersionName=1.0.${{ github.run_number }}

    - name: Verify APK is release-signed
      working-directory: apps/mobile/android
      # Guards against silently shipping a debug-signed artifact if the
      # signingConfig ever regains a fallback.
      run: |
        APK=app/build/outputs/apk/release/app-release.apk
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
        if grep -qi "CN=Android Debug" certs.txt; then
          echo "::error::APK is debug-signed - refusing to publish."
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 7
        if-no-files-found: error

    # =========================================================
    # E2E TESTING ON MACOS (COMMENTED OUT BY DEFAULT)
    # macOS runners natively support nested virtualization required
    # for the Android Emulator to run quickly and reliably.
    # Warning: macOS minutes are consumed at 10x the Linux rate.
