name: LocalSampark CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# backend, apps/web and apps/admin are npm *workspaces* of the repo root.
# There is exactly one lockfile (./package-lock.json) and one node_modules
# tree; ./backend/package-lock.json and friends have never existed. Pointing
# setup-node's cache-dependency-path at them failed the job outright with
# "Some specified paths were not resolved, unable to cache dependencies",
# before a single line of app code was touched.
#
# So: install once at the root with `npm ci`, then drive each package through
# `--workspace`. That also stops `npm ci || npm install` from quietly building
# a second, unlocked dependency tree inside each app directory.

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        env:
          USE_SQLITE: 'true'
          JWT_SECRET: ci-test-jwt-secret-key
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-key
        run: npm run test --workspace=backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test Web App (links, API URL, session refresh, no invented data)
        run: npm test --workspace=apps/web
      - name: Build Web App
        run: npm run build --workspace=apps/web
        env:
          # apps/web/src/lib/api.js treats this as the ORIGIN and appends
          # /api/v1 itself. Setting it to ".../api/v1" here produced
          # http://localhost:5000/api/v1/api/v1 in the built bundle.
          NEXT_PUBLIC_API_URL: http://localhost:5000

  admin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test Admin App (every request goes through fetchJson)
        run: npm test --workspace=apps/admin
      - name: Build Admin App
        run: npm run build --workspace=apps/admin
        env:
          # Same contract as the web app: apps/admin/src/lib/api.js appends
          # /api/v1 to this value.
          NEXT_PUBLIC_API_URL: http://localhost:5000

  mobile-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          # apps/mobile is not a workspace; it has its own lockfile.
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npx jest --config jest.config.js --ci
      - name: Bundle for Android (proves the app compiles)
        run: npx expo export --platform android --output-dir /tmp/expo-out
        env:
          CI: '1'

  docker-build:
    # The Dockerfiles build from the repository root. Nothing else in CI builds an image, so a
    # broken COPY path or lockfile mismatch would otherwise surface on deploy day.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t localsampark-api:ci .
      - name: Build web image
        run: >
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:5000
          --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000
          -t localsampark-web:ci .
      - name: API image starts and passes its own health probe
        run: |
          docker run -d --name api -e NODE_ENV=development -e USE_SQLITE=true             -e JWT_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef             -e JWT_REFRESH_SECRET=ci-only-refresh-0123456789abcdef0123456789             -e CLIENT_URL=http://localhost:3000 -p 5000:5000 localsampark-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
