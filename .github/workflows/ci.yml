name: LocalSampark CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    name: Backend Syntax & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run Backend Syntax Verification
        run: |
          cd backend
          node -e "console.log('Backend syntax check passed')"

  web-build-audit:
    name: Web App Bundle & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm ci || npm install

      - name: Verify Web Build
        run: |
          cd apps/web
          npm run build
