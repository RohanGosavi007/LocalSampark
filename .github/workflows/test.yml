name: LocalSampark CI/CD Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test
  JWT_SECRET: ci-test-jwt-secret-key
  JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-key
  USE_SQLITE: true

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────
  lint:
    name: ESLint & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # This was `npx eslint backend/src --ext .js --max-warnings 0 || true`,
      # which never linted anything: there was no ESLint config for the
      # backend, so eslint exited with "couldn't find a configuration file",
      # and the trailing `|| true` turned that into a green check. ESLint was
      # not a dependency of the root workspace either, so `npx` would have
      # tried to download it on every run.
      #
      # backend/.eslintrc.js now exists and eslint is a root devDependency.
      # The rule set is correctness-focused (no-undef, no-unreachable,
      # no-empty and friends); it found four genuine ReferenceError crashes on
      # its first run. Style rules are warnings and do not block.
      - name: Backend lint
        run: npm run lint --workspace=backend

  # ── Job 2: Unit Tests ───────────────────────────────────────
  unit-tests:
    name: Backend Unit Tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit -- --ci --coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

  # ── Job 3: API Integration Tests ───────────────────────────
  api-tests:
    name: API Integration Tests (Supertest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit -- --ci --testPathPattern=integration

  # ── Job 4: E2E Web Tests ───────────────────────────────────
  e2e-web:
    name: E2E Web Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=web-chromium
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-web-report
          path: test-results/

  # ── Job 5: E2E Admin Tests ─────────────────────────────────
  e2e-admin:
    name: E2E Admin Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=admin-chromium
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-admin-report
          path: test-results/

  # ── Job 6: Visual Regression ───────────────────────────────
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # This is currently a no-op gate, on two counts, and is left permissive
      # on purpose until baselines exist:
      #   1. Every committed baseline under
      #      tests/e2e/visual/web-pages.spec.js-snapshots/ is suffixed
      #      -win32.png. On ubuntu-latest Playwright looks for -linux.png,
      #      finds nothing, and has no baseline to compare against.
      #   2. --update-snapshots then writes fresh images and always passes.
      # To make this a real gate: download the linux snapshots from this
      # job's artifact, commit them, and drop --update-snapshots.
      - run: npx playwright test --project=visual --update-snapshots || true
      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: tests/e2e/visual/

  # ── Job 7: Accessibility Tests ─────────────────────────────
  accessibility:
    name: Accessibility Tests (a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=a11y
      - name: Upload a11y Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: test-results/

  # ── Job 8: API Contract Tests ──────────────────────────────
  api-contract:
    name: API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install
      - run: npx playwright test --project=api

  # ── Job 9: Load Tests (main branch only) ───────────────────
  load-tests:
    name: Load & Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    needs: [e2e-web, e2e-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # Each `run:` step gets its own shell, and `npm run dev:backend` starts
      # nodemon under the workflow-level NODE_ENV=test — under which
      # server.js deliberately never calls startServer(), so nothing ever
      # listened and artillery measured a closed port. Start the server
      # directly, with NODE_ENV unset to 'development', and wait for /health
      # instead of a fixed sleep.
      - name: Start backend and wait for health
        env:
          NODE_ENV: development
          USE_SQLITE: 'true'
          PORT: '5000'
        run: |
          node backend/src/server.js &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/health > /dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend failed to become healthy within 30s"; exit 1
      - run: mkdir -p test-results
      - run: npx artillery run backend/load-tests/critical-flow.yml --output test-results/load-report.json
      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: test-results/load-report.json

  # ── 10x NEW: Security Scan ──────────────────────────────────
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts

      - name: NPM Audit (High + Critical only)
        run: npm audit --audit-level=high --omit=dev || true

      - name: Check for known vulnerabilities
        run: |
          npx --yes audit-ci@^6 --high || true

      - name: Detect hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          # Check for common secret patterns in source code
          grep -rn --include="*.js" --include="*.ts" --include="*.env" \
            -E "(password|secret|api_key|apikey|token)\s*[:=]\s*['\"][^'\"]{8,}" \
            backend/src/ || echo "✅ No hardcoded secrets detected"

      - name: Check for vulnerable dependencies
        run: |
          npx --yes better-npm-audit audit --level high || true

      - name: License compliance check
        run: |
          npx --yes license-checker --production --failOn "GPL-3.0;AGPL-3.0" || true

