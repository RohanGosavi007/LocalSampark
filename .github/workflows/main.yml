name: Super-App CI/CD Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# Superseded PR runs are cancelled: a second push to the same branch makes the
# first run's result irrelevant, and these jobs build the Next.js app and two
# full dependency trees.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-test:
    name: Lint, Type-Check, Unit Tests, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install Workspace Dependencies
        # backend and apps/web are workspaces of the repo root and share its
        # lockfile. `cd apps/web && npm ci` fell through to `npm install`
        # every time (no local lockfile), producing an unlocked tree.
        run: npm ci

      - name: Install Mobile Dependencies
        # apps/mobile is deliberately outside the workspaces list — Metro and
        # the Expo autolinker resolve badly against a hoisted root tree — so
        # it installs separately from its own lockfile.
        working-directory: apps/mobile
        run: npm ci

      - name: Backend - Lint & Test
        env:
          USE_SQLITE: true
          JWT_SECRET: "test-secret"
        run: |
          npm run lint --workspace=backend --if-present
          npm run test --workspace=backend --if-present

      - name: Mobile - Lint
        # The original ~350 pre-existing errors (broken .eslintrc.js env,
        # unhandled Detox globals, compiled/binary files being linted, and a
        # string of real undefined-reference crash bugs) have all been fixed
        # or deliberately excluded — 0 errors remain, so this is now a real
        # merge gate. ~1129 unused-var/hook-dependency warnings still remain
        # and don't fail the build.
        run: |
          cd apps/mobile
          npm run lint

      - name: Web App - Production Build Check
        env:
          # apps/web/src/lib/api.js appends /api/v1 to this origin itself.
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npm run build --workspace=apps/web
