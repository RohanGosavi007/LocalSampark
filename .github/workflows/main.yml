name: Super-App CI/CD Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    name: Lint, Type-Check, Unit Tests, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd apps/web && npm ci || npm install
          cd ../../backend && npm ci || npm install

      - name: Backend - Lint & Test
        env:
          USE_SQLITE: true
          JWT_SECRET: "test-secret"
        run: |
          cd backend
          npm run lint --if-present
          npm test --if-present

      - name: Web App - Production Build Check
        run: |
          cd apps/web
          npm run build
