name: Super-App CI/CD Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    name: Lint, Type-Check, Unit Tests, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd apps/web && npm ci || npm install
          cd ../mobile && npm ci || npm install
          cd ../../backend && npm ci || npm install

      - name: Backend - Lint & Test
        env:
          USE_SQLITE: true
          JWT_SECRET: "test-secret"
        run: |
          cd backend
          npm run lint --if-present
          npm test --if-present

      - name: Mobile - Lint
        # The original ~350 pre-existing errors (broken .eslintrc.js env,
        # unhandled Detox globals, compiled/binary files being linted, and a
        # string of real undefined-reference crash bugs) have all been fixed
        # or deliberately excluded — 0 errors remain, so this is now a real
        # merge gate. ~1129 unused-var/hook-dependency warnings still remain
        # and don't fail the build.
        run: |
          cd apps/mobile
          npm run lint

      - name: Web App - Production Build Check
        run: |
          cd apps/web
          npm run build
