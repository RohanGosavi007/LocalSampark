# LocalSampark — Render.com Deployment Configuration (Backend + Background Workers)
services:
  # 1. Main API Server
  - type: web
    name: localsampark-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: localsampark-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: localsampark-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    autoDeploy: false # Managed by GitHub Actions

  # 2. BullMQ Campaign & Surge Pricing Worker
  - type: worker
    name: localsampark-worker
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --prefix backend
    startCommand: node backend/src/jobs/campaignScheduler.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: localsampark-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: localsampark-redis
          property: connectionString

  # 3. Redis Cache Engine
  - type: redis
    name: localsampark-redis
    region: singapore
    plan: starter

  # 5. Frontend Web App
  - type: web
    name: localsampark-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start --workspace=apps/web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: localsampark-api
          property: envVars.RENDER_EXTERNAL_URL
    autoDeploy: false

databases:
  # 4. Core PostgreSQL Database
  - name: localsampark-db
    databaseName: localsampark
    user: localsampark_admin
    region: singapore
    plan: starter
