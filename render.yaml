# LocalSampark — Render.com Deployment Configuration (Backend + Background Workers)
services:
  # 1. Main API Server
  - type: web
    name: localsampark-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: localsampark-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: localsampark-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ── Payment gateways ────────────────────────────────────────────────
      # These were not declared here at all, so they were unset in production.
      # The effect was silent: paymentGateway.service.js dropped into
      # simulated-order mode, and payment.gateway.js signed webhooks with a
      # literal 'mocksecret' published in the source. Both now fail closed, so
      # the endpoints return 400/503 until these are filled in.
      # sync:false means Render prompts for the value instead of storing it here.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: SAAS_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ── SMS / OTP delivery (MSG91) ──────────────────────────────────────
      # Without these, smsOtp.service.js logs the OTP instead of sending it,
      # and reports success either way.
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      # ── Firebase Admin (push notifications) ─────────────────────────────
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
    autoDeploy: false # Managed by GitHub Actions

  # 2. BullMQ Campaign & Surge Pricing Worker
  - type: worker
    name: localsampark-worker
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --prefix backend
    startCommand: node backend/src/jobs/campaignScheduler.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: localsampark-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: localsampark-redis
          property: connectionString

  # 3. Redis Cache Engine
  - type: redis
    name: localsampark-redis
    region: singapore
    plan: starter

  # 5. Frontend Web App
  - type: web
    name: localsampark-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start --workspace=apps/web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: localsampark-api
          property: envVars.RENDER_EXTERNAL_URL
    autoDeploy: false

databases:
  # 4. Core PostgreSQL Database
  - name: localsampark-db
    databaseName: localsampark
    user: localsampark_admin
    region: singapore
    plan: starter
