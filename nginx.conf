user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Uploads (photos, documents) are capped at 10 MB by the API; nginx's default of 1 MB
    # answered 413 to anything larger before the API ever saw it.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=30r/s;

    # WebSocket upgrade only when the client asks for it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream backend_servers {
        server backend:5000;
    }

    upstream frontend_servers {
        server web:3000;
    }

    server {
        listen 80;
        server_name api.localsampark.in localsampark.in www.localsampark.in;
        return 301 https://$host$request_uri;
    }

    # ── API: /api/*, /socket.io/*, /health ──
    server {
        listen 443 ssl;
        server_name api.localsampark.in;

        # Certificates: mount them at ./ssl (see docker-compose.production.yml).
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            # No CORS headers here. This block used to answer every preflight with
            # "Access-Control-Allow-Origin: *", overriding the API's origin allow-list (and
            # being invalid for credentialed requests). The API answers its own preflights.
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # The API reads the client address from X-Forwarded-For (one trusted hop; see
            # backend/src/config/proxy.js) for rate limits and the admin IP allow-list.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            # Socket.IO connections are long-lived; the default 60 s read timeout cuts quiet ones.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            limit_req zone=api_limit burst=20 nodelay;
        }
    }

    # ── Web app: / (including /admin/* pages of the web app) ──
    server {
        listen 443 ssl;
        server_name localsampark.in www.localsampark.in;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /_next/static/ {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            limit_req zone=web_limit burst=50 nodelay;
        }
    }
}
