# HTTP-only nginx for the local and staging compose stacks (no certificates needed).
# Production uses nginx.conf, which terminates TLS.
#   /            -> web app          /api/*, /socket.io/*, /health -> API
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 12m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Resolved per request (Docker's embedded DNS), so the stack starts even when a service is
    # absent: the staging compose file has no web container, and a static upstream would stop
    # nginx at boot with "host not found".
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location ~ ^/(api|socket\.io|health) {
            set $api_upstream http://backend:5000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location / {
            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
