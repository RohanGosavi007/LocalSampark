version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: localsampark-redis-staging
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localsampark-api-staging
    restart: always
    environment:
      - NODE_ENV=staging
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_staging_key
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: localsampark-ingress-staging
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
