# Self-hosted production stack: PostGIS, PgBouncer, Redis, API, web app, nginx (TLS).
#
#   export DB_PASSWORD=...            # required: compose refuses to start without it
#   export API_PUBLIC_URL=https://api.localsampark.in
#   export SITE_PUBLIC_URL=https://localsampark.in
#   docker compose -f docker-compose.production.yml up -d --build
#
# Real values live in backend/.env.production (see the root .env.example). nginx needs
# certificates at ./ssl/fullchain.pem and ./ssl/privkey.pem (e.g. copied from certbot).
# Images are built from the repository root; the Dockerfiles say why.

services:
  postgres:
    # PostGIS, not stock PostgreSQL: the schema opens with CREATE EXTENSION postgis and
    # declares GEOGRAPHY columns throughout.
    image: postgis/postgis:15-3.4-alpine
    container_name: localsampark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localsampark_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: localsampark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localsampark_user -d localsampark"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Transaction-mode pooling keeps PostgreSQL under ~20 server connections while the Node
  # pool holds many more client connections.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: localsampark-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://localsampark_user:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/localsampark
      POOL_MODE: transaction
      MAX_DB_CONNECTIONS: 20
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      MAX_CLIENT_CONN: 200
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_CHECK_QUERY: SELECT 1
      SERVER_CHECK_DELAY: 30
      STATS_PERIOD: 60
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: localsampark-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: localsampark-api
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      USE_SQLITE: "false"
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_NAME: localsampark
      DB_USER: localsampark_user
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRUST_PROXY_HOPS: "1"
    networks:
      default:
        # nginx.conf (shared with the dev and staging stacks) names the API upstream "backend".
        aliases:
          - backend
    # The HEALTHCHECK lives in backend/Dockerfile (busybox wget; the alpine image has no curl).

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Compiled into the browser bundle at build time; changing them means rebuilding.
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_PUBLIC_URL:?set SITE_PUBLIC_URL}
    container_name: localsampark-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production

  nginx:
    image: nginx:1.27-alpine
    container_name: localsampark-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
