version: '3.8'

services:
  # ─── PostgreSQL Database ──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: localsampark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localsampark_user
      POSTGRES_PASSWORD: YOUR_SECURE_PASSWORD
      POSTGRES_DB: localsampark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ─── Redis Cache ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: localsampark-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ─── Backend API ──────────────────────────────────
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: localsampark-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      USE_SQLITE: "false"
      DB_HOST: postgres
      REDIS_HOST: redis

  # ─── Web Frontend ─────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: localsampark-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - ./apps/web/.env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.localsampark.com

  # ─── NGINX Reverse Proxy ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: localsampark-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
