version: '3.8'

services:
  # ─── PostgreSQL Database ──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: localsampark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localsampark_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-YOUR_SECURE_PASSWORD}
      POSTGRES_DB: localsampark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localsampark_user -d localsampark"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 10x NEW: PgBouncer Connection Pooler ─────────
  # Transaction-mode pooling: keeps PostgreSQL under 20 active connections
  # while allowing 100+ Node.js-side connections via the pool
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: localsampark-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://localsampark_user:${DB_PASSWORD:-YOUR_SECURE_PASSWORD}@postgres:5432/localsampark
      POOL_MODE: transaction
      MAX_DB_CONNECTIONS: 20
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      MAX_CLIENT_CONN: 200
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_CHECK_QUERY: SELECT 1
      SERVER_CHECK_DELAY: 30
      STATS_PERIOD: 60
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Redis Cache & Queue ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: localsampark-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: localsampark-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      USE_SQLITE: "false"
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_NAME: localsampark
      DB_USER: localsampark_user
      DB_PASSWORD: ${DB_PASSWORD:-YOUR_SECURE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Web Frontend ─────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: localsampark-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - ./apps/web/.env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.localsampark.com

  # ─── NGINX Reverse Proxy ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: localsampark-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
